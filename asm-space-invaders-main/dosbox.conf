# Local game configuration. Start DOSBox-X with this project as working directory.
[sdl]
fullscreen=true
fullresolution=desktop
output=openglnb
[dosbox]
machine=svga_s3
working directory option=noprompt
[render]
scaler=none
aspect=true
aspect_ratio=3:2
[cpu]
core=normal
cputype=386
cycles=max
[mixer]
nosound=true
[autoexec]
@echo off
mount c "."
c:
INVADERS.COM
exit
