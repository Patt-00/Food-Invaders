# Local game configuration. Start DOSBox-X with this project as working directory.
[sdl]
fullscreen=false
[dosbox]
machine=svga_s3
working directory option=noprompt
[render]
scaler=none
aspect=false
[cpu]
core=normal
cputype=386
[mixer]
nosound=true
[autoexec]
@echo off
mount c "."
c:
INVADERS.COM
exit
